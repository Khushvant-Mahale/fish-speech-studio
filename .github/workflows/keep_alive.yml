name: Render Keep Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier sleep (which suspends after 15 mins of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render Health Check Endpoint
        run: |
          echo "Pinging Kashva Voice Render instance at $(date)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://kashva-voice-zsvb.onrender.com/health || true)
          echo "Render response status code: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Render instance is active and healthy!"
          else
            echo "Instance was pinged (Status: $STATUS). Sleep timer reset."
          fi
