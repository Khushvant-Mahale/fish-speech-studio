databases:
  - name: kashva-db
    databaseName: kashva
    user: kashva_user
    plan: free
    region: oregon

services:
  - type: web
    name: kashva-voice
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "7860"
      - key: DATABASE_URL
        fromDatabase:
          name: kashva-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FISH_API_KEY
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
